apiVersion: v1
kind: Service
metadata:
  name: viro-worker
  namespace: viro
spec:
  clusterIP: None
  selector:
    app: viro-worker
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: viro-worker
  namespace: viro
spec:
  serviceName: viro-worker
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: viro-worker
  template:
    metadata:
      labels:
        app: viro-worker
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: viro:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: VIRO_ROLE
              value: worker
            - name: KAFKA_BOOTSTRAP
              value: kafka:9092
            - name: KAFKA_TOPIC
              value: viro-observations
            - name: VIRO_DATA_DIR
              value: /data
            - name: PORT
              value: "8080"
            - name: JAVA_TOOL_OPTIONS
              value: -Xmx256m -Xint -XX:UseAVX=0 -XX:UseSSE=2
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: viro-gateway
  namespace: viro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: viro-gateway
  template:
    metadata:
      labels:
        app: viro-gateway
    spec:
      containers:
        - name: gateway
          image: viro:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: VIRO_ROLE
              value: gateway
            - name: WORKER_URLS
              value: http://viro-worker-0.viro-worker:8080,http://viro-worker-1.viro-worker:8080,http://viro-worker-2.viro-worker:8080
            - name: PORT
              value: "8080"
            - name: JAVA_TOOL_OPTIONS
              value: -Xmx256m -Xint -XX:UseAVX=0 -XX:UseSSE=2
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: viro-gateway
  namespace: viro
spec:
  selector:
    app: viro-gateway
  ports:
    - port: 8080
      targetPort: 8080
